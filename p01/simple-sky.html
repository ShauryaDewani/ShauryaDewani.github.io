<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1 - A-Frame Sky</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="nebula" src="IMAGES/heic2007a.jpg" crossorigin="anonymous" />
      </a-assets>

      <a-sky src="#nebula"></a-sky>

      <a-text
        value="Exercise 1 - A-Frame Sky"
        color="#FFFFFF"
        align="center"
        width="8"
        position="0 2 -4"
      ></a-text>

      <a-box
        position="0 1 -3"
        rotation="0 45 0"
        color="#FF4D4D"
        depth="1"
        height="1"
        width="1"
      ></a-box>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
