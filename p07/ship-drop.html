<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Exercise 7 - Spaceship Drop</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
</head>

<body>

<script>
AFRAME.registerComponent("reset-on-click", {
  init: function () {
    this.el.addEventListener("click", () => {
      this.el.setAttribute("position", "0 5 -5");
      this.el.components["dynamic-body"].syncToPhysics();
    });
  }
});
</script>

<a-scene physics="gravity: 0 -9.8 0" cursor="rayOrigin: mouse">

  <a-assets>
    <a-asset-item id="ship" src="./IMAGES/SpaceShip.glb"></a-asset-item>
    <img id="mars" src="./IMAGES/mars-surface.avif">
  </a-assets>

  <!-- spaceship -->
  <a-entity
    gltf-model="#ship"
    position="0 5 -5"
    scale="2 2 2"
    dynamic-body
    reset-on-click>
  </a-entity>

  <!-- ground -->
  <a-plane
    position="0 0 -5"
    rotation="-90 0 0"
    width="10"
    height="10"
    src="#mars"
    static-body>
  </a-plane>

  <a-sky color="#000"></a-sky>

</a-scene>

</body>
</html>
