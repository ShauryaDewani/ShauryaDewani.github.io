<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Exercise 6 - Earth Spin and Orbit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <script>
      AFRAME.registerComponent('orbit', {
        schema: {
          radius: { type: 'number', default: 3 },
          speed: { type: 'number', default: 1 }
        },
        init: function () {
          this.angle = 0;
        },
        tick: function (time, timeDelta) {
          this.angle += this.data.speed * (timeDelta / 1000);
          this.el.object3D.position.x = this.data.radius * Math.cos(this.angle);
          this.el.object3D.position.z = this.data.radius * Math.sin(this.angle) - 6;
        }
      });
    </script>

    <a-scene>
      <a-entity camera wasd-controls look-controls position="0 1.6 2"></a-entity>

      <a-light type="ambient" color="#888"></a-light>
      <a-light type="directional" color="#FFF" intensity="1" position="-1 2 1"></a-light>

      <a-sphere
        id="earthSphere"
        color="#4CC9F0"
        radius="1"
        position="3 1.5 -6"
        orbit="radius: 3; speed: 1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-sphere>

      <a-box position="0 0.75 -6" color="#FFC65D"></a-box>
      <a-plane position="0 0 -6" rotation="-90 0 0" width="12" height="12" color="#7BC8A4"></a-plane>
      <a-sky color="#000000"></a-sky>
    </a-scene>
  </body>
</html>
