<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Exercise 5 - Click Events</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <script>
      AFRAME.registerComponent('my-color-toggle', {
        init: function () {
          const el = this.el;

          this.toggleColor = function () {
            const currentColor = el.getAttribute('color');

            if (currentColor === 'orange') {
              if (el.id === 'two') {
                el.setAttribute('color', 'blue');
              } else if (el.id === 'three') {
                el.setAttribute('color', 'green');
              }
            } else {
              el.setAttribute('color', 'orange');
            }
          };

          el.addEventListener('click', this.toggleColor);
        },

        remove: function () {
          this.el.removeEventListener('click', this.toggleColor);
        }
      });
    </script>

    <a-scene cursor="rayOrigin: mouse;" raycaster="objects: .rayclick">
      <a-box
        id="one"
        position="-2 1 -7"
        color="red">
      </a-box>

      <a-box
        id="two"
        position="0 1 -7"
        color="blue"
        class="rayclick"
        my-color-toggle>
      </a-box>

      <a-box
        id="three"
        position="2 1 -7"
        color="green"
        class="rayclick"
        my-color-toggle>
      </a-box>

      <a-camera position="0 1.6 0"></a-camera>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
